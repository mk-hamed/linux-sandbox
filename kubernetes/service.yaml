apiVersion: v1
kind: Service
metadata: 
  name: linux-sandbox
  namespace: linux-sandbox
  annotations: 
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"

spec:
  selector:
    app: linux-sandbox
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 7681